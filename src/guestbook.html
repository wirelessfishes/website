---
layout: layouts/layout.njk
title: WIRELESS.FISH guestbook
description: Sharky waz here 2026

extra_css:
  - /css/page/guestbook.css
---

<script src="/scripts/guestbook.js" defer></script>

<section>
  <h2>Guestbook</h2>
  <p>Let me know you were here! An actual living creature!</p>

  <div class="guestbook-reply-status" id="guestbook-reply">
    <button class="button-cancel" id="guestbook-reply_cancel" style="float: right">Cancel</button>
    <span id="guestbook-reply_name">&gt;&gt;&gt; Replying to NAME</span>
  </div>

  <form id="guestbook-form">
    <div class="guestbook-form_head">
      <div>
        <label for="guestbook-form_name">Name <span class="color-darkred">*</span></label
        ><br />
        <input id="guestbook-form_name" name="name" placeholder="Jane Doe" type="text" required />
      </div>

      <div>
        <label for="guestbook-form_url">Your website</label><br />
        <input id="guestbook-form_url" name="your website" placeholder="https://example.com" type="url" />
      </div>
    </div>

    <div>
      <label for="guestbook-form_message">Message <span class="color-darkred">*</span></label
      ><br />
      <textarea
        id="guestbook-form_message"
        name="message"
        placeholder="Rat activiy has increased exponentially"
        type="text"
        required
      ></textarea>
    </div>

    <div id="guestbook-form_status"></div>

    <button class="button" type="submit"><span>Submit</span></button>
  </form>
</section>

<section>
  <h3>Entries</h3>

  <div id="guestbook-content"><div style="text-align: center; font-size: larger">Loading entries...</div></div>

  <details>
    <summary>Guestbook archive <span class="less-important">(prior to 2026/07/27)</span></summary>
    <div id="guestbook-content-archive"></div>
  </details>
</section>
